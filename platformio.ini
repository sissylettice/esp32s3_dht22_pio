[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Your board has 4MB flash; the default devkitc-1 profile assumes 8MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv

lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient

; Route Serial over the native USB port (the one labelled USB, not UART/COM).
; If you use the UART/COM port instead, delete these three lines.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Stop the serial monitor from resetting the board into download mode
monitor_rts = 0
monitor_dtr = 0